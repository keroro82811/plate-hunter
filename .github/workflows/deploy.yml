name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: source

      - name: Build
        run: npx vite build
        working-directory: source
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

      - name: Copy build to root and push
        run: |
          cp -r source/dist/assets ./assets
          cp source/dist/index.html ./index.html
          cp source/dist/sw.js ./sw.js
          cp source/dist/registerSW.js ./registerSW.js
          cp source/dist/manifest.webmanifest ./manifest.webmanifest
          ls source/dist/workbox-*.js && cp source/dist/workbox-*.js ./
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ index.html sw.js registerSW.js manifest.webmanifest workbox-*.js
          git diff --staged --quiet || git commit -m "Auto deploy: update build [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/keroro82811/plate-hunter.git main
