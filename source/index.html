<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        function shouldSuppress(err, msg, file, stack) {
          const s = String(err?.message || msg || '') + ' ' + String(stack || err?.stack || '') + ' ' + String(file || '');
          return (
            s.indexOf('WebSocket') !== -1 ||
            s.indexOf('@vite/client') !== -1 ||
            s.indexOf('vite:ws') !== -1 ||
            s.indexOf('vite') !== -1 ||
            s.indexOf('AbortError') !== -1 ||
            s.indexOf('Failed to fetch') !== -1 ||
            s.indexOf('NetworkError') !== -1
          );
        }
        window.addEventListener('unhandledrejection', function(e) {
          if (shouldSuppress(e.reason, '', '', e.reason?.stack)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(e) {
          if (shouldSuppress(e.error, e.message, e.filename, e.error?.stack)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <style>

        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
      }
    </style>
  </head>

</html>
